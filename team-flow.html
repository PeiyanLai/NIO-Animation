<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>对讲机组队 · 交互用户流程图</title>
<style>
/* ═══ NIOFlow Design System (Ace) tokens ═══
   亮色为规范默认；深色按规范 #0a0a0a + #00D4D4 高亮 */
:root {
  color-scheme: light dark;

  --bg:        #F0FAFA;
  --card:      #FFFFFF;
  --soft:      #D0F5F5;
  --line:      #D8EEEE;
  --line-2:    #B8DEDE;

  --ink-1:     #1A1F1F;
  --ink-2:     #2E3D3D;
  --ink-3:     #5C7070;
  --ink-4:     #8AABAB;

  --accent:    #00bebe;
  --accent-2:  #00D4D4;
  --sage:      #004b64;

  --risk-1:    #8AABAB;
  --risk-2:    #5C7070;
  --neg:       #D14545;

  --u-owner-a: #00D4D4; --u-owner-b: #00AAAA;
  --u-mate-a:  #7B6CE8; --u-mate-b:  #5D4DD4;
  --u-frnd-a:  #E8B947; --u-frnd-b:  #D49922;
  --u-team:    #004b64;

  --sh-card:   0 16px 34px -22px rgba(0,60,70,.15);
  --sh-lift:   0 24px 50px -32px rgba(0,60,70,.18);
  --sh-glow:   0 0 0 4px rgba(0,190,190,.15);

  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --f-data: ui-monospace, "SF Mono", SFMono-Regular, "Roboto Mono",
            "DejaVu Sans Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0a0a0a;
    --card:      #101717;
    --soft:      #0E2A2A;
    --line:      #1C2C2C;
    --line-2:    #2C4242;

    --ink-1:     #E8F4F4;
    --ink-2:     #C4D8D8;
    --ink-3:     #85A0A0;
    --ink-4:     #5C7070;

    --accent:    #00D4D4;
    --accent-2:  #00D4D4;
    --sage:      #7EEAEA;

    --u-team:    #7EEAEA;

    --sh-card:   0 16px 34px -22px rgba(0,0,0,.55);
    --sh-lift:   0 24px 50px -32px rgba(0,0,0,.6);
    --sh-glow:   0 0 0 4px rgba(0,212,212,.16);
  }
}

:root[data-theme="dark"] {
  --bg:        #0a0a0a;
  --card:      #101717;
  --soft:      #0E2A2A;
  --line:      #1C2C2C;
  --line-2:    #2C4242;

  --ink-1:     #E8F4F4;
  --ink-2:     #C4D8D8;
  --ink-3:     #85A0A0;
  --ink-4:     #5C7070;

  --accent:    #00D4D4;
  --accent-2:  #00D4D4;
  --sage:      #7EEAEA;

  --u-team:    #7EEAEA;

  --sh-card:   0 16px 34px -22px rgba(0,0,0,.55);
  --sh-lift:   0 24px 50px -32px rgba(0,0,0,.6);
  --sh-glow:   0 0 0 4px rgba(0,212,212,.16);
}

:root[data-theme="light"] {
  --bg:        #F0FAFA;
  --card:      #FFFFFF;
  --soft:      #D0F5F5;
  --line:      #D8EEEE;
  --line-2:    #B8DEDE;

  --ink-1:     #1A1F1F;
  --ink-2:     #2E3D3D;
  --ink-3:     #5C7070;
  --ink-4:     #8AABAB;

  --accent:    #00bebe;
  --accent-2:  #00D4D4;
  --sage:      #004b64;

  --u-team:    #004b64;

  --sh-card:   0 16px 34px -22px rgba(0,60,70,.15);
  --sh-lift:   0 24px 50px -32px rgba(0,60,70,.18);
  --sh-glow:   0 0 0 4px rgba(0,190,190,.15);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink-2);
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

html, body { height: 100%; }
.wrap {
  width: 100%;
  height: 100dvh;
  margin: 0;
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ─── header ─────────────────────────────────────────────────────────── */
.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 20px;
}
.mrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.eyebrow {
  font-family: var(--f-data);
  font-size: 10.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin: 0;
}
@media (max-width: 760px) { .stats { display: none; } }
.masthead h1 {
  font-size: 18px;
  line-height: 1.2;
  margin: 0;
  color: var(--ink-1);
  letter-spacing: -.01em;
}
.stats {
  display: flex;
  gap: 18px;
  font-family: var(--f-data);
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stats b { color: var(--accent); font-weight: 600; }

/* ─── 工具条 ─────────────────────────────────────────────────────────── */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
}
.tgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tlabel {
  font-family: var(--f-data);
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--ink-4);
  text-transform: uppercase;
}
.fchip {
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink-3);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color .15s, background .15s, color .15s;
}
.fchip:hover { border-color: var(--accent); }
.fchip[aria-pressed="true"] {
  background: var(--soft);
  border-color: var(--accent);
  color: var(--sage);
  font-weight: 600;
}
.fchip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot-owner { background: linear-gradient(135deg, var(--u-owner-a), var(--u-owner-b)); }
.dot-mate  { background: linear-gradient(135deg, var(--u-mate-a),  var(--u-mate-b)); }
.dot-frnd  { background: linear-gradient(135deg, var(--u-frnd-a),  var(--u-frnd-b)); }
.dot-team  { background: var(--u-team); }
.fchip:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.reset-btn { margin-left: auto; }

/* ─── 主区：画布铺满，详情浮层 ───────────────────────────────────────── */
.stage-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
}

.canvas-scroll {
  flex: 1;
  min-width: 0;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--sh-card);
}
.canvas-outer { position: relative; overflow: hidden; }
.canvas {
  position: relative;
  width: 1360px;
  height: 850px;
  transform-origin: 0 0;
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 26px 26px;
}
.canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* 场景分区 */
.zone {
  position: absolute;
  border: 1.5px dashed var(--line-2);
  border-radius: 14px;
  background: rgba(0, 190, 190, .03);
  pointer-events: none;
}
.zone .zl {
  position: absolute;
  top: 10px; left: 14px;
  font-family: var(--f-data);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--ink-4);
  text-transform: uppercase;
}
.zone .zl b { color: var(--ink-3); font-weight: 600; letter-spacing: .06em; }

/* 节点 */
.node {
  position: absolute;
  width: 200px;
  background: var(--card);
  border: 1px solid var(--line-2);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 9px 11px 8px;
  box-shadow: var(--sh-card);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  transition: opacity .2s, box-shadow .2s, border-color .2s;
}
.node:active { cursor: grabbing; }
.node.wide { width: 244px; }
.node[data-u="owner"] { border-left-color: var(--u-owner-b); }
.node[data-u="mate"]  { border-left-color: var(--u-mate-b); }
.node[data-u="frnd"]  { border-left-color: var(--u-frnd-b); }
.node[data-u="team"]  { border-left-color: var(--u-team); }
.node[data-kind="pain"] { border-left-color: var(--risk-2); }
.node[data-kind="note"] { border-style: dashed; border-left-style: solid; }
.node.sel {
  border-color: var(--accent);
  box-shadow: var(--sh-lift), var(--sh-glow);
  z-index: 5;
}
.node.dim { opacity: .16; }
.node h4 {
  margin: 0 0 2px;
  font-size: 13.5px;
  line-height: 1.3;
  color: var(--ink-1);
  display: flex;
  align-items: center;
  gap: 6px;
}
.node h4 .pain-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neg); flex: none; }
.node .ns { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.node .nrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.utag {
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: 999px;
  color: var(--sage);
  background: var(--soft);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.utag .dot { width: 7px; height: 7px; border-radius: 50%; }
.dtag {
  font-family: var(--f-data);
  font-size: 10px;
  letter-spacing: .03em;
  padding: 1.5px 7px;
  border-radius: 4px;
  border: 1px solid var(--line-2);
  color: var(--ink-3);
  background: var(--bg);
}

/* 边 */
.edge path { fill: none; stroke: var(--line-2); stroke-width: 1.8; transition: opacity .2s; }
.edge.hot path { stroke: var(--accent); stroke-width: 2.4; }
.edge.dim { opacity: .1; }
.edge text {
  font-family: var(--f-data);
  font-size: 10.5px;
  fill: var(--ink-3);
  stroke: var(--card);
  stroke-width: 5;
  paint-order: stroke;
  letter-spacing: .04em;
}
.edge.hot text { fill: var(--accent); }

/* 详情浮层：覆盖在画布右上角，不占布局空间 */
.panel {
  position: absolute;
  top: 10px;
  right: 10px;
  width: min(306px, calc(100% - 20px));
  max-height: calc(100% - 20px);
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--sh-lift);
  padding: 14px 16px 16px;
  z-index: 30;
  display: none;
}
.panel.open { display: block; }
.pclose {
  position: absolute;
  top: 8px;
  right: 10px;
  border: 0;
  background: none;
  color: var(--ink-4);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  padding: 4px;
}
.pclose:hover { color: var(--ink-1); }
.pclose:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.panel .ph {
  font-family: var(--f-data);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin: 0 0 10px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--line);
}
.panel h3 { margin: 0 0 8px; font-size: 16.5px; color: var(--ink-1); line-height: 1.3; }
.panel .sec { margin-top: 12px; }
.panel .sec .sl {
  font-family: var(--f-data);
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 5px;
}
.panel .row { display: flex; flex-wrap: wrap; gap: 5px; }
.panel p.desc { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.panel .hint { font-size: 12.5px; color: var(--ink-3); margin: 0 0 10px; }
.scen-tag {
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--sage);
}

/* 说明 */
.footnote {
  font-size: 12.5px;
  color: var(--ink-4);
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.footnote b { color: var(--ink-3); font-weight: 600; }

/* ─── 编辑表单与连线选择 ─────────────────────────────────────────────── */
.field { margin-top: 10px; }
.field > label {
  display: block;
  font-family: var(--f-data);
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 4px;
}
.field input[type="text"], .field textarea, .field select {
  width: 100%;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 6px 9px;
  font: inherit;
  font-size: 13px;
  background: var(--bg);
  color: var(--ink-1);
}
.field textarea { min-height: 76px; resize: vertical; }
.field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  color: var(--ink-2);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 3px 10px;
  cursor: pointer;
}
.checks input { accent-color: var(--accent); margin: 0; }
.pbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.pbtn {
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink-2);
  border-radius: 8px;
  padding: 6px 13px;
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
}
.pbtn:hover { border-color: var(--accent); }
.pbtn.primary {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border-color: transparent;
  color: #FFFFFF;
  font-weight: 600;
}
.pbtn.danger { color: var(--neg); border-color: #E0B4B4; }
.pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.canvas.linking .node { cursor: crosshair; }
.canvas svg .hit { pointer-events: stroke; cursor: pointer; stroke: rgba(0,0,0,0); stroke-width: 16; fill: none; }
.meta-hint { font-size: 11.5px; color: var(--ink-4); margin-top: 10px; }
</style>
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <div class="mrow">
      <h1>对讲机组队功能 · 交互式用户流程图</h1>
      <p class="eyebrow">NIOFlow · 需求拆解 · 2026-07-31</p>
    </div>
    <div class="stats">
      <span><b>3</b> 类用户</span>
      <span><b>4</b> 个阶段 / 场景</span>
      <span><b>7</b> 个依赖端与系统</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="tgroup" id="scenChips" role="group" aria-label="按使用场景筛选">
      <span class="tlabel">场景</span>
      <button class="fchip" type="button" data-scen="all" aria-pressed="true">全部</button>
      <button class="fchip" type="button" data-scen="main" aria-pressed="false">主流程</button>
      <button class="fchip" type="button" data-scen="s1" aria-pressed="false">场景一 · 无网通信</button>
      <button class="fchip" type="button" data-scen="s2" aria-pressed="false">场景二 · 非品牌车</button>
    </div>
    <div class="tgroup" id="userChips" role="group" aria-label="按用户类型筛选">
      <span class="tlabel">用户</span>
      <button class="fchip" type="button" data-user="all" aria-pressed="true">全部</button>
      <button class="fchip" type="button" data-user="owner" aria-pressed="false"><span class="dot dot-owner"></span>车主（发起人）</button>
      <button class="fchip" type="button" data-user="mate" aria-pressed="false"><span class="dot dot-mate"></span>品牌车队友</button>
      <button class="fchip" type="button" data-user="frnd" aria-pressed="false"><span class="dot dot-frnd"></span>非品牌车朋友</button>
    </div>
    <div class="tgroup" role="group" aria-label="编辑">
      <span class="tlabel">编辑</span>
      <button class="fchip" type="button" id="addNodeBtn">＋ 新增节点</button>
      <button class="fchip" type="button" id="exportBtn">导出 JSON</button>
      <button class="fchip" type="button" id="restoreBtn">恢复默认</button>
    </div>
    <div class="tgroup" role="group" aria-label="缩放">
      <span class="tlabel">缩放</span>
      <button class="fchip" type="button" id="zoomOut" aria-label="缩小">−</button>
      <button class="fchip" type="button" id="zoomIn" aria-label="放大">＋</button>
      <button class="fchip" type="button" id="zoomFit">适应宽度</button>
      <button class="fchip" type="button" id="zoom100">100%</button>
    </div>
    <button class="fchip reset-btn" type="button" id="resetBtn">重置布局</button>
  </div>

  <div class="stage-wrap">

    <div class="canvas-scroll" id="canvasScroll">
      <div class="canvas-outer" id="canvasOuter">
      <div class="canvas" id="canvas">
        <div class="zone" style="left:30px; top:64px; width:508px; height:322px;">
          <span class="zl"><b>阶段一</b> · 购买与组队 — 主流程</span>
        </div>
        <div class="zone" style="left:566px; top:64px; width:764px; height:230px;">
          <span class="zl"><b>阶段二</b> · 有网组队体验 — 主流程</span>
        </div>
        <div class="zone" style="left:566px; top:322px; width:764px; height:238px;">
          <span class="zl"><b>场景一</b> · 无网通信 — 对讲机硬件组网</span>
        </div>
        <div class="zone" style="left:30px; top:600px; width:1300px; height:222px;">
          <span class="zl"><b>场景二</b> · 非品牌车加入 — App + 对讲机硬件</span>
        </div>
        <svg id="edgeSvg" aria-hidden="true"></svg>
      </div>
      </div>
    </div>

    <aside class="panel" id="panel">
      <button class="pclose" id="panelClose" type="button" aria-label="关闭">×</button>
      <p class="ph">节点详情</p>
      <div id="panelBody"></div>
    </aside>

  </div>

  

</div>

  var canvas = document.getElementById("canvas");

  var scroller = document.getElementById("canvasScroll");

  function openPanel() { panelEl.classList.add("open"); }
  function hidePanel() { panelEl.classList.remove("open"); }
  var CW = 1360, CH = 850;
  var NS = "http://www.w3.org/2000/svg";

  var NODES = [], EDGES = [], byId = {};
  var state = { scen: "all", user: "all", sel: null, selEdge: null, linking: null };
  var S = 1, zoomMode = "fit";
  var idSeq = 100;

  /* ── 存取 ───────────────────────────────────────────────────────── */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function strip(n) {
    var o = { id: n.id, x: Math.round(n.x), y: Math.round(n.y), u: n.u, scen: n.scen,
              deps: n.deps, t: n.t, s: n.s, d: n.d };
    if (n.kind) o.kind = n.kind;
    if (n.wide) o.wide = true;
    return o;
  }
  function serialize() {
    return {
      nodes: NODES.map(strip),
      edges: EDGES.map(function (e) {
        var o = { f: e.f, t: e.t2 !== undefined ? e.t2 : e.t };
        if (e.l) o.l = e.l;
        if (e.bend) o.bend = e.bend;
        return o;
      })
    };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(serialize())); } catch (err) {}
  }
  function loadData() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.nodes && d.nodes.length) return d;
      }
    } catch (err) {}
    return clone(DEFAULT);
  }

  /* ── 缩放 ───────────────────────────────────────────────────────── */
  function setScale(sc, mode) {
    S = Math.max(.4, Math.min(1.5, sc));
    zoomMode = mode;
    canvas.style.transform = "scale(" + S + ")";
    outer.style.width = (CW * S) + "px";
    outer.style.height = (CH * S) + "px";
  }
  function fit() {
    var s = Math.max((scroller.clientWidth - 2) / CW, (scroller.clientHeight - 2) / CH);
    setScale(s, "fit");
  }

  /* ── 节点 DOM ───────────────────────────────────────────────────── */
  function renderNodeContent(n) {
    n.el.className = "node" + (n.wide ? " wide" : "");
    var key = n.u.indexOf("team") >= 0 || n.u.length > 1 ? "team" : n.u[0];
    n.el.dataset.u = key;
    if (n.kind) n.el.dataset.kind = n.kind; else delete n.el.dataset.kind;

    n.el.innerHTML = "";
    var h = document.createElement("h4");
    if (n.kind === "pain") { var pd = document.createElement("span"); pd.className = "pain-dot"; h.appendChild(pd); }
    h.appendChild(document.createTextNode(n.t));
    n.el.appendChild(h);

    if (n.s) {
      var ns = document.createElement("div");
      ns.className = "ns";
      ns.textContent = n.s;
      n.el.appendChild(ns);
    }

    var row = document.createElement("div");
    row.className = "nrow";
    var ut = document.createElement("span");
    ut.className = "utag";
    ut.innerHTML = '<span class="dot ' + USERS[key].dot + '"></span>' + USERS[key].name;
    row.appendChild(ut);
    n.deps.slice(0, 2).forEach(function (dep) {
      var dt = document.createElement("span");
      dt.className = "dtag";
      dt.textContent = dep;
      row.appendChild(dt);
    });
    if (n.deps.length > 2) {
      var more = document.createElement("span");
      more.className = "dtag";
      more.textContent = "+" + (n.deps.length - 2);
      row.appendChild(more);
    }
    n.el.appendChild(row);
  }

  function makeNodeEl(n) {
    var el = document.createElement("div");
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    n.el = el;
    if (n.x0 === undefined) { n.x0 = n.x; n.y0 = n.y; }
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    renderNodeContent(n);
    canvas.appendChild(el);

    var sx, sy, nx, ny, moved;
    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      el.setPointerCapture(ev.pointerId);
      sx = ev.clientX; sy = ev.clientY;
      nx = n.x; ny = n.y; moved = false;
    });
    el.addEventListener("pointermove", function (ev) {
      if (sx === undefined) return;
      var dx = (ev.clientX - sx) / S, dy = (ev.clientY - sy) / S;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (!moved) return;
      n.x = Math.max(6, Math.min(CW - el.offsetWidth - 6, nx + dx));
      n.y = Math.max(6, Math.min(CH - el.offsetHeight - 6, ny + dy));
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";
      drawEdges();
    });
    function up() {
      if (sx === undefined) return;
      sx = undefined;
      if (moved) { save(); return; }
      if (state.linking && state.linking !== n.id) { finishLink(n.id); return; }
      if (state.linking === n.id) { cancelLink(); return; }
      select(state.sel === n.id ? null : n.id);
    }
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("dblclick", function () { state.sel = n.id; apply(); showNodeForm(n); });
    el.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); }
    });
  }

  /* ── 边 DOM ─────────────────────────────────────────────────────── */
  function makeEdgeEl(e) {
    var g = document.createElementNS(NS, "g");
    g.setAttribute("class", "edge");
    var p = document.createElementNS(NS, "path");
    p.setAttribute("marker-end", "url(#arr)");
    g.appendChild(p);
    var hit = document.createElementNS(NS, "path");
    hit.setAttribute("class", "hit");
    g.appendChild(hit);
    var tx = null;
    if (e.l) {
      tx = document.createElementNS(NS, "text");
      tx.setAttribute("text-anchor", "middle");
      tx.textContent = e.l;
      g.appendChild(tx);
    }
    svg.appendChild(g);
    e.g = g; e.p = p; e.hit = hit; e.tx = tx;
    hit.addEventListener("click", function () { selectEdge(e); });
  }

  function rebuildEdgeEl(e) {
    if (e.g) e.g.remove();
    makeEdgeEl(e);
    drawEdges();
    apply();
  }

  function anchors(a, b) {
    var aw = a.el.offsetWidth, ah = a.el.offsetHeight;
    var bw = b.el.offsetWidth, bh = b.el.offsetHeight;
    if (b.x > a.x + aw - 20) return [a.x + aw, a.y + ah / 2, b.x, b.y + bh / 2, "h"];
    if (b.x + bw < a.x + 20)  return [a.x, a.y + ah / 2, b.x + bw, b.y + bh / 2, "h"];
    if (b.y > a.y)            return [a.x + aw / 2, a.y + ah, b.x + bw / 2, b.y, "v"];
    return [a.x + aw / 2, a.y, b.x + bw / 2, b.y + bh, "v"];
  }

  function cubicAt(k, x1, c1, c2, x2) {
    var mk = 1 - k;
    return mk*mk*mk*x1 + 3*mk*mk*k*c1 + 3*mk*k*k*c2 + k*k*k*x2;
  }

  function drawEdges() {
    EDGES.forEach(function (e) {
      var a = byId[e.f], b = byId[e.t];
      if (!a || !b) return;
      var an = anchors(a, b);
      var x1 = an[0], y1 = an[1], x2 = an[2], y2 = an[3], dir = an[4];
      var c1x, c1y, c2x, c2y;
      if (e.bend === "left") {
        x1 = a.x + 30; y1 = a.y;
        x2 = b.x + 30; y2 = b.y + b.el.offsetHeight;
        c1x = x1 - 96; c1y = y1 - 140;
        c2x = x2 - 96; c2y = y2 + 140;
      } else if (dir === "h") {
        var dx = Math.max(36, Math.abs(x2 - x1) * .45) * (x2 > x1 ? 1 : -1);
        c1x = x1 + dx; c1y = y1;
        c2x = x2 - dx; c2y = y2;
      } else {
        var dy = Math.max(30, Math.abs(y2 - y1) * .45) * (y2 > y1 ? 1 : -1);
        c1x = x1; c1y = y1 + dy;
        c2x = x2; c2y = y2 - dy;
      }
      var d = "M" + x1 + " " + y1 + " C" + c1x + " " + c1y + ", " + c2x + " " + c2y + ", " + x2 + " " + y2;
      e.p.setAttribute("d", d);
      e.hit.setAttribute("d", d);
      if (e.tx) {
        e.tx.setAttribute("x", cubicAt(.5, x1, c1x, c2x, x2).toFixed(1));
        e.tx.setAttribute("y", (cubicAt(.5, y1, c1y, c2y, y2) - 6).toFixed(1));
      }
    });
  }

  /* ── 筛选与高亮 ─────────────────────────────────────────────────── */
  function nodeVisible(n) {
    var sOK = state.scen === "all" || n.scen.indexOf(state.scen) >= 0;
    var uOK = state.user === "all" || n.u.indexOf(state.user) >= 0 || n.u.indexOf("team") >= 0;
    return sOK && uOK;
  }

  function apply() {
    NODES.forEach(function (n) {
      n.el.classList.toggle("dim", !nodeVisible(n));
      n.el.classList.toggle("sel", state.sel === n.id);
    });
    EDGES.forEach(function (e) {
      var a = byId[e.f], b = byId[e.t];
      if (!a || !b) return;
      var dim = !nodeVisible(a) || !nodeVisible(b);
      var hot = !dim && (state.selEdge === e ||
                (state.sel && (e.f === state.sel || e.t === state.sel)));
      e.g.setAttribute("class", "edge" + (dim ? " dim" : "") + (hot ? " hot" : ""));
      e.p.setAttribute("marker-end", hot ? "url(#arrHot)" : "url(#arr)");
    });
  }

    panelBody.appendChild(route);

    var iL = field(panelBody, "连线标签（可留空）", function () {
      var i = document.createElement("input"); i.type = "text"; i.value = e.l || ""; return i;
    });

    var btns = document.createElement("div");
    btns.className = "pbtns";
    btns.appendChild(elBtn("保存标签", "primary", function () {
      e.l = iL.value.trim();
      if (!e.l) delete e.l;
      rebuildEdgeEl(e);
      save();
      selectEdge(e);
    }));
    btns.appendChild(elBtn("反转方向", "", function () {
      var tmp = e.f; e.f = e.t; e.t = tmp;
      delete e.bend;
      drawEdges();
      apply();
      save();
      showEdge(e);
    }));
    btns.appendChild(elBtn("删除连线", "danger", function () {
      e.g.remove();
      EDGES.splice(EDGES.indexOf(e), 1);
      state.selEdge = null;
      apply();
      save();
      showHome();
    }));
    panelBody.appendChild(btns);
  }

  function select(id) {
    state.sel = id;
    state.selEdge = null;
    if (id) showNode(byId[id]); else showHome();
    apply();
  }
  function selectEdge(e) {
    state.sel = null;
    state.selEdge = e;
    showEdge(e);
    apply();
  }

  /* ── 连线模式 ───────────────────────────────────────────────────── */
  function startLink(n) {
    state.linking = n.id;
    canvas.classList.add("linking");
    panelBody.innerHTML = "";
    var h3 = document.createElement("h3");
    h3.textContent = "连线模式";
    panelBody.appendChild(h3);
    var p = document.createElement("p");
    p.className = "desc";
    p.textContent = "从「" + n.t + "」出发：点击目标节点完成连线；按 Esc 或点击原节点取消。";
    panelBody.appendChild(p);
    var btns = document.createElement("div");
    btns.className = "pbtns";
    btns.appendChild(elBtn("取消连线", "", cancelLink));
    panelBody.appendChild(btns);
  }
  function finishLink(targetId) {
    var from = state.linking;
    state.linking = null;
    canvas.classList.remove("linking");
    var dup = EDGES.some(function (e) { return e.f === from && e.t === targetId; });
    if (dup || from === targetId) { select(targetId); return; }
    var e = { f: from, t: targetId };
    EDGES.push(e);
    makeEdgeEl(e);
    drawEdges();
    save();
    selectEdge(e);
  }
  function cancelLink() {
    state.linking = null;
    canvas.classList.remove("linking");
    select(state.sel);
  }

  /* ── 增删节点 ───────────────────────────────────────────────────── */
  function addNode() {
    var id;
    do { id = "n" + (++idSeq); } while (byId[id]);
    var cx = Math.round((scroller.scrollLeft + scroller.clientWidth / 2) / S - 100);
    var cy = Math.round((scroller.scrollTop + scroller.clientHeight / 2) / S - 40);
    var n = {
      id: id,
      x: Math.max(6, Math.min(CW - 210, cx)),
      y: Math.max(6, Math.min(CH - 100, cy)),
      u: ["team"], scen: ["main"], deps: [],
      t: "新节点", s: "", d: ""
    };
    NODES.push(n);
    byId[id] = n;
    makeNodeEl(n);
    state.sel = id;
    apply();
    save();
    showNodeForm(n, true);
  }

  function deleteNode(n) {
    for (var i = EDGES.length - 1; i >= 0; i--) {
      if (EDGES[i].f === n.id || EDGES[i].t === n.id) {
        EDGES[i].g.remove();
        EDGES.splice(i, 1);
      }
    }
    n.el.remove();
    NODES.splice(NODES.indexOf(n), 1);
    delete byId[n.id];
    if (state.sel === n.id) state.sel = null;
    drawEdges();
    apply();
    save();
    showHome();
  }

  /* ── 初始化 / 重建 ──────────────────────────────────────────────── */
  function initMarkers() {
    var defs = document.createElementNS(NS, "defs");
    ["arr", "arrHot"].forEach(function (id) {
      var m = document.createElementNS(NS, "marker");
      m.setAttribute("id", id);
      m.setAttribute("markerWidth", "8");
      m.setAttribute("markerHeight", "8");
      m.setAttribute("refX", "6.5");
      m.setAttribute("refY", "4");
      m.setAttribute("orient", "auto-start-reverse");
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", "M1 1 L7 4 L1 7");
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", id === "arrHot" ? "var(--accent)" : "var(--line-2)");
      p.setAttribute("stroke-width", "1.6");
      p.setAttribute("stroke-linecap", "round");
      m.appendChild(p);
      defs.appendChild(m);
    });
    svg.appendChild(defs);
  }

  function buildFrom(data) {
    NODES.forEach(function (n) { if (n.el) n.el.remove(); });
    EDGES.forEach(function (e) { if (e.g) e.g.remove(); });
    NODES = data.nodes.map(clone);
    EDGES = data.edges.map(clone);
    byId = {};
    idSeq = 100;
    NODES.forEach(function (n) {
      byId[n.id] = n;
      var m = /^n(\d+)$/.exec(n.id);
      if (m) idSeq = Math.max(idSeq, +m[1]);
      makeNodeEl(n);
    });
    EDGES.forEach(makeEdgeEl);
    state.sel = null; state.selEdge = null; state.linking = null;
    drawEdges();
    apply();
    showHome();
    window.__flow.nodes = NODES;
    window.__flow.edges = EDGES;
  }

  /* ── 工具条 ─────────────────────────────────────────────────────── */
  function chipGroup(elId, attr, key) {
    var box = document.getElementById(elId);
    box.addEventListener("click", function (ev) {
      var btn = ev.target.closest(".fchip");
      if (!btn || btn.dataset[attr] === undefined) return;
      state[key] = btn.dataset[attr];
      Array.prototype.forEach.call(box.querySelectorAll(".fchip"), function (c) {
        c.setAttribute("aria-pressed", String(c === btn));
      });
      apply();
    });
  }
  chipGroup("scenChips", "scen", "scen");
  chipGroup("userChips", "user", "user");

  document.getElementById("resetBtn").addEventListener("click", function () {
    NODES.forEach(function (n) {
      if (n.x0 === undefined) return;
      n.x = n.x0; n.y = n.y0;
      n.el.style.left = n.x + "px";
      n.el.style.top = n.y + "px";
    });
    drawEdges();
    save();
  });

  document.getElementById("addNodeBtn").addEventListener("click", addNode);
  document.getElementById("panelClose").addEventListener("click", function () { select(null); });

  document.getElementById("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "team-flow.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });

  document.getElementById("restoreBtn").addEventListener("click", function () {
    if (!window.confirm("恢复为文档原始拆解？你的全部修改（含布局）将被清除。")) return;
    try { localStorage.removeItem(KEY); } catch (err) {}
    buildFrom(clone(DEFAULT));
  });

  document.getElementById("zoomOut").addEventListener("click", function () { setScale(S - .1, "manual"); });
  document.getElementById("zoomIn").addEventListener("click", function () { setScale(S + .1, "manual"); });
  document.getElementById("zoomFit").addEventListener("click", fit);
  document.getElementById("zoom100").addEventListener("click", function () { setScale(1, "manual"); });
  window.addEventListener("resize", function () { if (zoomMode === "fit") fit(); drawEdges(); });
  window.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && state.linking) cancelLink();
  });

  /* 测试钩子 */
  window.__flow = {
    nodes: NODES, edges: EDGES, state: state,
    select: select, apply: apply, draw: drawEdges,
    scale: function () { return S; },
    addNode: addNode, serialize: serialize
  };

  initMarkers();
  fit();
  buildFrom(loadData());
})();

</script>

</body>
</html>
